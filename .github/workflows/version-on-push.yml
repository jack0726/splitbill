name: Record app version

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  bump-and-record:
    if: ${{ !contains(github.event.head_commit.message, '[skip version]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update version and history
        env:
          PUSHED_SHA: ${{ github.sha }}
          PUSHED_AT: ${{ github.event.head_commit.timestamp }}
        run: node scripts/append-version.mjs
      - name: Commit version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json VERSIONS.md
          git commit -m "chore: record app version [skip version]"
          git push origin main
